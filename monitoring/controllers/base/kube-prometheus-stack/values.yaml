kubeControllerManager:
  service:
    selector:
      k8s-app: kube-controller-manager
kubeScheduler:
  service:
    selector:
      k8s-app: kube-scheduler

# R48: Alertmanager manda gli allarmi `warning` e `critical` a Cortex, che propone un compito di triage (nessuna azione parte da sola). Il resto va in `null`.
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - cortex-alertmanager-token # montato in /etc/alertmanager/secrets/cortex-alertmanager-token/token
    storage: {} # senza volume: lo stato (silenzi) si perde al riavvio, è accettabile
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: cortex
          matchers:
            - severity =~ "warning|critical"
            - alertname !~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: cortex
        webhook_configs:
          - url: http://cortex.cortex.svc:8000/webhooks/alertmanager
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/cortex-alertmanager-token/token

prometheus:
  prometheusSpec:
    podMonitorNamespaceSelector:
      matchLabels:
        app.kubernetes.io/component: monitoring

    # Discover all PodMonitors, Probes, PrometheusRules and ServiceMonitors
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  grafana.ini:
    date_formats:
      default_week_start: monday

  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      provider:
        allowUiUpdates: true

  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 4Gi
