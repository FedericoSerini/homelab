# R21: dashboard Grafana di Cortex. Il sidecar di kube-prometheus-stack legge solo i ConfigMap del namespace `monitoring` con l'etichetta grafana_dashboard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: cortex-dashboard
    files:
      - cortex.json
