apiVersion: apps/v1
kind: Deployment
metadata:
  name: bottega-knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bottega-knowledge
  template:
    metadata:
      labels:
        app: bottega-knowledge
    spec:
      containers:
        - name: bottega-knowledge
          image: ghcr.io/federicoserini/bottega-knowledge:latest
          ports:
            - containerPort: 8000
          env:
            - name: KNOWLEDGE_DATA_DIR
              value: /data
          volumeMounts:
            - name: bottega-knowledge-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: bottega-knowledge-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      imagePullSecrets:
        - name: ghcr-login-secret
      volumes:
        - name: bottega-knowledge-data
          persistentVolumeClaim:
            claimName: bottega-knowledge-data-pvc
