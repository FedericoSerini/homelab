# R48: l'agent di triage legge lo stato del cluster e non scrive. Niente `secrets` né `configmaps` (possono contenere credenziali), nessun verbo di scrittura.
# Il confine vero è questo ruolo: le regole di Claude Code nel pod sono una seconda barriera.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cortex-triage-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, namespaces, nodes, persistentvolumeclaims, persistentvolumes, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io, metrics.k8s.io]
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, source.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortex-triage-readonly
subjects:
  - kind: ServiceAccount
    name: cortex-triage
    namespace: cortex
roleRef:
  kind: ClusterRole
  name: cortex-triage-readonly
  apiGroup: rbac.authorization.k8s.io
