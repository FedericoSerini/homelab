apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex
spec:
  replicas: 1 # SQLite su volume RWO e stato in memoria: una sola replica
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortex
  template:
    metadata:
      labels:
        app: cortex
    spec:
      enableServiceLinks: false # senza, kubernetes inietta CORTEX_AGENT_PORT=tcp://… (dal Service `cortex-agent`) e il runner non parte
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # I subPath mancanti li crea kubelet come root: l'agent (utente 10001) non potrebbe scriverci.
        - name: dirs
          image: ghcr.io/federicoserini/cortex:latest
          imagePullPolicy: Always # :latest viene riscaricato a ogni avvio del pod; con IfNotPresent il nodo teneva sempre l'immagine in cache
          # La deploy key git: ssh rifiuta una chiave leggibile dal gruppo (con fsGroup i secret lo sono), quindi la copio con modo 600.
          # Resta nella cartella di git di Cortex, che il container agent non monta.
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /data/sandboxes /data/agent-home /data/agent-home-endpoint /data/agent-home-triage /data/prompts /data/git-home
              if [ -f /git-key/id_ed25519 ]; then install -m 600 /git-key/id_ed25519 /data/git-home/id_ed25519; fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: git-key
              mountPath: /git-key
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: cortex
          image: ghcr.io/federicoserini/cortex:latest
          imagePullPolicy: Always # :latest viene riscaricato a ogni avvio del pod; con IfNotPresent il nodo teneva sempre l'immagine in cache
          ports:
            - containerPort: 8000
          env:
            - name: CORTEX_PUBLIC_URL
              value: https://cortex.federicoserini.com
            - name: CORTEX_OIDC_ISSUER
              value: https://gatekeeper.federicoserini.com/realms/homelab
            - name: CORTEX_OIDC_JWKS_URL
              value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/certs
            - name: CORTEX_OIDC_TOKEN_URL
              value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/token
            - name: CORTEX_OIDC_CLIENT_ID
              value: cortex
            - name: CORTEX_GIT_SSH_KEY
              value: /data/git-home/id_ed25519 # deploy key in sola lettura, copiata dall'init container
            - name: CORTEX_AGENT_URL
              value: http://cortex-agent:9000 # l'agent gira in un pod separato (cortex-agent), vedi agent-deployment.yaml
            - name: CORTEX_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-agent-secret
                  key: CORTEX_AGENT_TOKEN
            - name: CORTEX_TRIAGE_PROJECT # R48: il progetto (da creare in Cortex, senza repository) le cui sessioni girano sull'agent di triage
              value: homelab
            - name: CORTEX_TRIAGE_AGENT_URL
              value: http://cortex-triage:9000
            - name: CORTEX_TRIAGE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-triage-secret
                  key: agent-token
            - name: CORTEX_ALERTMANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-triage-secret
                  key: alertmanager-token
            - name: CORTEX_METRICS_TOKEN # R21: /metrics per Prometheus
              valueFrom:
                secretKeyRef:
                  name: cortex-metrics-secret
                  key: token
          envFrom:
            - secretRef:
                name: cortex-secret # CORTEX_SESSION_SECRET, CORTEX_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # tcpSocket: il controllo Host dell'app risponde 400 a un httpGet con l'IP del pod
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            failureThreshold: 4
      volumes:
        - name: git-key
          secret:
            secretName: cortex-git-secret
            optional: true # senza il secret il pod parte lo stesso, ma i repository privati non si clonano
        - name: data
          persistentVolumeClaim:
            claimName: cortex-data
      imagePullSecrets:
        - name: ghcr-login-secret
