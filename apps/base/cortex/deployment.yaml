apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex
spec:
  replicas: 1 # SQLite su volume RWO e stato in memoria: una sola replica
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortex
  template:
    metadata:
      labels:
        app: cortex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # I subPath mancanti li crea kubelet come root: l'agent (utente 10001) non potrebbe scriverci.
        - name: dirs
          image: ghcr.io/federicoserini/cortex:latest
          imagePullPolicy: Always # :latest viene riscaricato a ogni avvio del pod; con IfNotPresent il nodo teneva sempre l'immagine in cache
          # La deploy key git: ssh rifiuta una chiave leggibile dal gruppo (con fsGroup i secret lo sono), quindi la copio con modo 600.
          # Resta nella cartella di git di Cortex, che il container agent non monta.
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /data/sandboxes /data/agent-home /data/agent-home-endpoint /data/prompts /data/git-home
              if [ -f /git-key/id_ed25519 ]; then install -m 600 /git-key/id_ed25519 /data/git-home/id_ed25519; fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: git-key
              mountPath: /git-key
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: cortex
          image: ghcr.io/federicoserini/cortex:latest
          imagePullPolicy: Always # :latest viene riscaricato a ogni avvio del pod; con IfNotPresent il nodo teneva sempre l'immagine in cache
          ports:
            - containerPort: 8000
          env:
            - name: CORTEX_PUBLIC_URL
              value: https://cortex.federicoserini.com
            - name: CORTEX_OIDC_ISSUER
              value: https://gatekeeper.federicoserini.com/realms/homelab
            - name: CORTEX_OIDC_JWKS_URL
              value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/certs
            - name: CORTEX_OIDC_TOKEN_URL
              value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/token
            - name: CORTEX_OIDC_CLIENT_ID
              value: cortex
            - name: CORTEX_GIT_SSH_KEY
              value: /data/git-home/id_ed25519 # deploy key in sola lettura, copiata dall'init container
            - name: CORTEX_AGENT_URL
              value: http://127.0.0.1:9000 # il container agent, nello stesso pod
            - name: CORTEX_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-agent-secret
                  key: CORTEX_AGENT_TOKEN
          envFrom:
            - secretRef:
                name: cortex-secret # CORTEX_SESSION_SECRET, CORTEX_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # tcpSocket: il controllo Host dell'app risponde 400 a un httpGet con l'IP del pod
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            failureThreshold: 4
        # Il codice dell'agent gira qui, non in `cortex`: questo container vede solo le cartelle delle sessioni e la HOME dell'agent,
        # non il database, i repository, la chiave git né i segreti di Cortex (nemmeno come variabili d'ambiente).
        - name: agent
          image: ghcr.io/federicoserini/cortex:latest
          imagePullPolicy: Always # :latest viene riscaricato a ogni avvio del pod; con IfNotPresent il nodo teneva sempre l'immagine in cache
          command: ["cortex-agent"]
          env:
            - name: CORTEX_DATA_DIR
              value: /data
            - name: CORTEX_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-agent-secret
                  key: CORTEX_AGENT_TOKEN
          volumeMounts:
            - { name: data, mountPath: /data/sandboxes, subPath: sandboxes }
            - { name: data, mountPath: /data/agent-home, subPath: agent-home }
            - { name: data, mountPath: /data/agent-home-endpoint, subPath: agent-home-endpoint }
            - { name: data, mountPath: /data/prompts, subPath: prompts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: git-key
          secret:
            secretName: cortex-git-secret
            optional: true # senza il secret il pod parte lo stesso, ma i repository privati non si clonano
        - name: data
          persistentVolumeClaim:
            claimName: cortex-data
      imagePullSecrets:
        - name: ghcr-login-secret
